# NPU 设备配置

# NPU 设备配置
npu:
  device_id: 0  # NPU 设备 ID
  soc_version: "Ascend310P3"  # 芯片型号
  # 可选: Ascend310, Ascend310P3, Ascend910, Ascend910B
  
# 性能配置
performance:
  precision: "fp16"  # 推理精度: fp32, fp16, int8
  profiling: false  # 是否开启性能分析
  log_level: "info"  # 日志级别: debug, info, warning, error
  
# 资源限制
resources:
  max_memory_mb: 4096  # 最大显存使用 (MB)
  num_threads: 4  # CPU 线程数
